<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="700"
    viewBox="0 0 1000 700"
>

    <rect
        x="0"
        y="0"
        width="1000"
        height="700"
        fill="white"
    />

    <text
        x="500.0"
        y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="20"
    >
        OBJ HIDDEN LINE TEST
    </text>

    <!-- HIDDEN -->
    <g
        fill="none"
        stroke="black"
        stroke-width="1.2"
        stroke-dasharray="8 5"
        stroke-linecap="butt"
    >
        <line x1="248.0000" y1="476.0000" x2="248.0000" y2="224.0000" />
<line x1="248.0000" y1="476.0000" x2="752.0000" y2="476.0000" />
<line x1="248.0000" y1="224.0000" x2="752.0000" y2="224.0000" />
<line x1="752.0000" y1="476.0000" x2="752.0000" y2="224.0000" />
    </g>

    <!-- VISIBLE -->
    <g
        fill="none"
        stroke="black"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <line x1="80.0000" y1="602.0000" x2="80.0000" y2="98.0000" />
<line x1="80.0000" y1="602.0000" x2="920.0000" y2="602.0000" />
<line x1="80.0000" y1="98.0000" x2="920.0000" y2="98.0000" />
<line x1="920.0000" y1="602.0000" x2="920.0000" y2="98.0000" />
    </g>

</svg>
